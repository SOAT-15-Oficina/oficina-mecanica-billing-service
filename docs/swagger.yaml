openapi: 3.0.3
info:
  title: Oficina Mecanica - Billing Service
  version: 0.3.0
  description: Orcamentos, decisao do cliente e cobranca por QR Code dinamico do Mercado Pago (Orders API).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: health
    description: Sondas de liveness e readiness
  - name: docs
    description: Contrato e Swagger UI
  - name: quotes
    description: Consulta de orcamentos pelo operador
  - name: public
    description: Links publicos enviados ao cliente por e-mail
  - name: payments
    description: Pagina publica do QR Code de pagamento
  - name: webhooks
    description: Notificacoes do Mercado Pago
paths:
  /ping:
    get:
      operationId: ping
      security: []
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Processo vivo
          content:
            text/plain:
              schema:
                type: string
                example: Pong
  /ready:
    get:
      operationId: ready
      security: []
      tags: [health]
      summary: Readiness
      responses:
        "200":
          description: Banco acessivel
        "503":
          description: Banco indisponivel
  /billing/docs/swagger.yaml:
    get:
      operationId: getOpenAPI
      security: []
      tags: [docs]
      summary: Contrato OpenAPI deste servico
      responses:
        "200":
          description: Contrato em YAML
          content:
            text/yaml:
              schema:
                type: string
  /billing/swagger:
    get:
      operationId: getSwaggerUI
      security: []
      tags: [docs]
      summary: Swagger UI
      responses:
        "200":
          description: Pagina HTML
          content:
            text/html:
              schema:
                type: string
  /billing/quotes/by-work-order/{workOrderId}:
    get:
      operationId: getQuoteByWorkOrder
      tags: [quotes]
      summary: Orcamento da OS com itens, decisoes e pagamentos
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      responses:
        "200":
          description: Orcamento completo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /billing/public/quotes/{quoteId}:
    get:
      operationId: getPublicQuote
      security: []
      tags: [public]
      summary: Resumo do orcamento para o cliente
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      responses:
        "200":
          description: Resumo sem dados de contato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /billing/public/quotes/{quoteId}/items/{workOrderServiceId}/approve:
    get:
      operationId: approveQuoteItem
      security: []
      tags: [public]
      summary: Aprova um item do orcamento
      description: Link GET enviado por e-mail. Quando o ultimo item pendente e decidido, publica billing.quote-approved ou billing.quote-rejected.
      parameters:
        - $ref: "#/components/parameters/QuoteId"
        - $ref: "#/components/parameters/WorkOrderServiceId"
      responses:
        "200":
          $ref: "#/components/responses/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /billing/public/quotes/{quoteId}/items/{workOrderServiceId}/reject:
    get:
      operationId: rejectQuoteItem
      security: []
      tags: [public]
      summary: Reprova um item do orcamento
      parameters:
        - $ref: "#/components/parameters/QuoteId"
        - $ref: "#/components/parameters/WorkOrderServiceId"
      responses:
        "200":
          $ref: "#/components/responses/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /billing/public/quotes/{quoteId}/approve-all:
    get:
      operationId: approveAllQuoteItems
      security: []
      tags: [public]
      summary: Aprova todos os itens pendentes
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      responses:
        "200":
          $ref: "#/components/responses/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /billing/public/quotes/{quoteId}/reject-all:
    get:
      operationId: rejectAllQuoteItems
      security: []
      tags: [public]
      summary: Reprova todos os itens pendentes
      parameters:
        - $ref: "#/components/parameters/QuoteId"
      responses:
        "200":
          $ref: "#/components/responses/Decision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /billing/public/payments/{paymentId}/qr:
    get:
      operationId: getPaymentQRPage
      security: []
      tags: [payments]
      summary: Pagina do QR Code de pagamento
      description: >-
        HTML em pt-BR com o QR Code em PNG embutido, o codigo copia e cola, valor, validade e
        situacao. Quando o pagamento nao esta PENDENTE (ou ja venceu), mostra so a situacao.
        E o checkout_url publicado em billing.payment-requested e enviado por e-mail.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Pagina HTML
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /billing/public/payments/{paymentId}/qr.png:
    get:
      operationId: getPaymentQRImage
      security: []
      tags: [payments]
      summary: Imagem PNG do QR Code de pagamento
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: QR Code gerado a partir do qr_data da order
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /billing/webhooks/mercadopago:
    post:
      operationId: mercadoPagoWebhook
      security: []
      tags: [webhooks]
      summary: Notificacao de order do Mercado Pago
      description: >-
        Configurado no painel do Mercado Pago (evento Order). Valida x-signature, HMAC-SHA256 de
        "id:<data.id>;request-id:<x-request-id>;ts:<ts>;" com o id em minusculas ou como veio
        (sem o trecho request-id quando o header falta). Ignora o corpo e consulta GET /v1/orders/{id}.
        processed publica billing.payment-confirmed; expired publica billing.payment-failed (EXPIRADO);
        canceled fora do Billing publica billing.payment-failed (RECUSADO); refunded so marca ESTORNADO.
        Repeticoes e demais status respondem 200 sem efeito.
      parameters:
        - name: data.id
          in: query
          required: true
          description: Identificador da order no Mercado Pago (ORD...)
          schema:
            type: string
            example: ORDTST01M7ERPPW2WBHKKR91AB0PZ2JB
        - name: type
          in: query
          required: true
          description: Tipo da notificacao; apenas order e tratado
          schema:
            type: string
            example: order
        - name: x-signature
          in: header
          required: true
          description: ts=<timestamp>,v1=<hmac hex>
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          description: Identificador da notificacao, parte do manifesto assinado quando presente
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Notificacao aceita (processada ou ignorada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          description: Assinatura invalida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha ao consultar a order; o Mercado Pago reenvia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkOrderServiceId:
      name: workOrderServiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Decision:
      description: Decisao registrada
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              quote:
                $ref: "#/components/schemas/PublicQuote"
    BadRequest:
      description: Identificador invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token ausente ou invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Papel sem permissao
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Orcamento, item ou pagamento inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Item ja decidido ou orcamento fechado (aprovado, reprovado ou cancelado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
    QuoteItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        work_order_service_id: {type: string, format: uuid}
        title: {type: string}
        price_cents: {type: integer}
        estimated_time_minutes: {type: integer}
        decision:
          type: string
          enum: [PENDENTE, APROVADO, REPROVADO]
        decided_at: {type: string, format: date-time}
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [PENDENTE, APROVADO, RECUSADO, EXPIRADO, ESTORNADO]
        amount_cents: {type: integer}
        provider_order_id:
          type: string
          description: Id da order QR no Mercado Pago (ORD...)
        qr_code_url:
          type: string
          description: Pagina publica do QR Code; a imagem fica em qr_code_url + ".png"
        qr_data:
          type: string
          description: Codigo EMV do QR (copia e cola)
        provider_payment_id:
          type: string
          description: Id da transacao (PAY...) depois de confirmado
        provider_refund_id: {type: string}
        failure_reason: {type: string}
        expires_at: {type: string, format: date-time}
        confirmed_at: {type: string, format: date-time}
        refunded_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    PublicPayment:
      type: object
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [PENDENTE, APROVADO, RECUSADO, EXPIRADO, ESTORNADO]
        amount_cents: {type: integer}
        provider_order_id: {type: string}
        qr_code_url: {type: string}
        qr_data: {type: string}
        expires_at: {type: string, format: date-time}
    QuoteStatus:
      type: string
      enum: [ENVIADO, APROVADO, REPROVADO, CANCELADO]
    PublicQuote:
      type: object
      properties:
        id: {type: string, format: uuid}
        work_order_code: {type: string}
        customer_name: {type: string}
        status:
          $ref: "#/components/schemas/QuoteStatus"
        total_cents: {type: integer}
        approved_total_cents: {type: integer}
        supply_shortage: {type: boolean}
        sent_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        payment_url:
          type: string
          description: Pagina do QR Code enquanto houver pagamento pendente
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PublicPayment"
    Quote:
      type: object
      properties:
        id: {type: string, format: uuid}
        work_order_id: {type: string, format: uuid}
        saga_id: {type: string, format: uuid}
        work_order_code: {type: string}
        customer_name: {type: string}
        customer_email: {type: string}
        status:
          $ref: "#/components/schemas/QuoteStatus"
        total_cents: {type: integer}
        approved_total_cents: {type: integer}
        supply_shortage: {type: boolean}
        sent_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
