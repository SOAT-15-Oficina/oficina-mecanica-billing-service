services:
  api:
    build: .
    env_file: .env
    ports:
      - "${API_HOST_PORT:-8091}:${SERVER_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      mpfake:
        condition: service_healthy
      mailhog:
        condition: service_started

  migrate:
    build: .
    command: ["migrate"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./local/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics | grep -q billing-events"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_HOST_PORT:-8025}:8025"

  mpfake:
    build:
      context: .
      target: mpfake
    environment:
      PORT: "8095"
      MPFAKE_WEBHOOK_URL: http://api:${SERVER_PORT}/billing/webhooks/mercadopago
      MERCADOPAGO_POS_EXTERNAL_ID: ${MERCADOPAGO_POS_EXTERNAL_ID:-OFICINAMATRIZPOS01}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
    ports:
      - "${MPFAKE_HOST_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "/mpfake", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
