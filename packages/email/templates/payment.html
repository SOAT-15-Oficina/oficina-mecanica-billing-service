<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Pagamento do orçamento</title>
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #333333; background-color: #f4f4f7; margin: 0; padding: 24px">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; padding: 32px">
      <h1 style="font-size: 22px; margin: 0 0 16px 0">Pagamento do orçamento</h1>
      <p>Olá, <strong>{{.CustomerName}}</strong>.</p>
      <p>
        Recebemos a sua aprovação do orçamento da ordem de serviço <strong>{{.WorkOrderCode}}</strong>.
        O valor aprovado é <strong>{{.Amount}}</strong>.
      </p>
      <p>O reparo começa assim que o pagamento for confirmado pelo Mercado Pago.</p>
      <p>
        <a href="{{.CheckoutURL}}" style="display: inline-block; background-color: #2563eb; color: #ffffff; padding: 12px 20px; border-radius: 6px; text-decoration: none">Pagar com Mercado Pago</a>
      </p>
      <p style="font-size: 13px; color: #6b7280">O link expira em {{.ExpiresAt}}.</p>
    </div>
  </body>
</html>
